[package]
name = "remarkable-reader-buddy"
# Cargo requires a package version; application versions come only from Git tags.
version = "0.0.0"
publish = false
edition = "2021"
rust-version = "1.96"
repository = "https://github.com/s116821/ReMarkableBuddies"

[build-dependencies]
vergen-gitcl = { version = "=10.0.3", features = ["emit_and_set"] }

[dependencies]
tokio = { version = "1.28", features = ["full"] }
ureq = { version = "3.0", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
base64 = "0.22"
image = "0.25.5"
byteorder = "1.4"
clap = { version = "4.0", features = ["derive", "env"] }
resvg = "0.45"
dotenv = "0.15"
imageproc = "0.25.0"
env_logger = "0.11.6"
log = "0.4.22"
figment = { version = "0.10", features = ["toml", "env"] }
toml = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
nix = { version = "0.29", features = ["ioctl"] }

[lib]
name = "remarkable_reader_buddy"
path = "src/lib.rs"

[dev-dependencies]
# Explicit native-evidence example only; not linked into the installed runtime.
sha2 = "0.10"

[[bin]]
name = "reader-buddy"
path = "src/main.rs"

