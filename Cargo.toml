[package]
name = "remarkable-reader-buddy"
# Own version is intentionally omitted; release identity comes from Git history.
publish = false
autoexamples = false
edition = "2021"
rust-version = "1.96"
repository = "https://github.com/s116821/ReMarkableBuddies"

[build-dependencies]
vergen-gitcl = { version = "=10.0.3", features = ["emit_and_set"] }

[dependencies]
tokio = { version = "1.28", features = ["full"] }
ureq = { version = "3.0", features = ["json"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "hickory-dns"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
anyhow = "1.0"
base64 = "0.22"
image = "0.25.5"
byteorder = "1.4"
clap = { version = "4.0", features = ["derive", "env"] }
resvg = "0.45"
dotenv = "0.15"
imageproc = "0.25.0"
env_logger = "0.11.6"
log = "0.4.22"
figment = { version = "0.10", features = ["toml", "env"] }
toml = "0.8"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "=0.42.0"
percent-encoding = "=2.3.2"
lopdf = { version = "=0.46.0", default-features = false }

remarkable-open-sdk = { git = "https://github.com/s116821/ReMarkableOpenSDK", rev = "f03cc7227d6b32213d6d49ae8c61a1cef6d43711", default-features = false, features = ["native-adapter", "development-capture"] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
nix = { version = "0.29", features = ["ioctl"] }

[lib]
name = "remarkable_reader_buddy"
path = "src/lib.rs"

[features]
development-input-diagnostics = []
development-resident-bootstrap = []

[[example]]
name = "resident_bootstrap_control"
path = "docs/examples/resident_bootstrap_control.rs"
required-features = ["development-resident-bootstrap"]

[[example]]
name = "resident_bootstrap_observer"
path = "docs/examples/resident_bootstrap_observer.rs"
required-features = ["development-resident-bootstrap"]

[dev-dependencies]
remarkable-open-sdk = { git = "https://github.com/s116821/ReMarkableOpenSDK", rev = "f03cc7227d6b32213d6d49ae8c61a1cef6d43711", default-features = false, features = ["mock", "development-capture"] }
# Explicit native-evidence example only; not linked into the installed runtime.
sha2 = "0.10"

[[bin]]
name = "reader-buddy"
path = "src/main.rs"


[[example]]
name = "append_probe"
path = "docs/examples/append_probe.rs"

[[example]]
name = "hardware_probe"
path = "docs/examples/hardware_probe.rs"

[[example]]
name = "history_cycle"
path = "docs/examples/history_cycle.rs"

[[example]]
name = "native_page"
path = "docs/examples/native_page.rs"

[[example]]
name = "native_text"
path = "docs/examples/native_text.rs"

[[example]]
name = "normalize_epub_source"
path = "docs/examples/normalize_epub_source.rs"

[[example]]
name = "normalize_pdf_source"
path = "docs/examples/normalize_pdf_source.rs"

[[example]]
name = "notebook_ocr_check"
path = "docs/examples/notebook_ocr_check.rs"

[[example]]
name = "observe_input"
path = "docs/examples/observe_input.rs"

[[example]]
name = "owned_frame"
path = "docs/examples/owned_frame.rs"

[[example]]
name = "owned_relative_gesture"
path = "docs/examples/owned_relative_gesture.rs"

[[example]]
name = "page_eligibility"
path = "docs/examples/page_eligibility.rs"

[[example]]
name = "reader_once"
path = "docs/examples/reader_once.rs"

[[example]]
name = "readiness_probe"
path = "docs/examples/readiness_probe.rs"

[[example]]
name = "research_provider_check"
path = "docs/examples/research_provider_check.rs"

[[example]]
name = "researched_answer_check"
path = "docs/examples/researched_answer_check.rs"

[[example]]
