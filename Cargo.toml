[package]
name = "remarkable-reader-buddy"
# Own version is intentionally omitted; release identity comes from Git history.
publish = false
edition = "2021"
rust-version = "1.96"
repository = "https://github.com/s116821/ReMarkableBuddies"

[build-dependencies]
vergen-gitcl = { version = "=10.0.3", features = ["emit_and_set"] }

[dependencies]
tokio = { version = "1.28", features = ["full"] }
ureq = { version = "3.0", features = ["json"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "hickory-dns"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
base64 = "0.22"
image = "0.25.5"
byteorder = "1.4"
clap = { version = "4.0", features = ["derive", "env"] }
resvg = "0.45"
dotenv = "0.15"
imageproc = "0.25.0"
env_logger = "0.11.6"
log = "0.4.22"
figment = { version = "0.10", features = ["toml", "env"] }
toml = "0.8"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "=0.42.0"
percent-encoding = "=2.3.2"

remarkable-open-sdk = { git = "https://github.com/s116821/ReMarkableOpenSDK", rev = "32b86e4fef04844cbf2ec31129bf029cc1d9899a", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
nix = { version = "0.29", features = ["ioctl"] }

[lib]
name = "remarkable_reader_buddy"
path = "src/lib.rs"

[dev-dependencies]
remarkable-open-sdk = { git = "https://github.com/s116821/ReMarkableOpenSDK", rev = "32b86e4fef04844cbf2ec31129bf029cc1d9899a", default-features = false, features = ["mock"] }
# Explicit native-evidence example only; not linked into the installed runtime.
sha2 = "0.10"

[[bin]]
name = "reader-buddy"
path = "src/main.rs"

