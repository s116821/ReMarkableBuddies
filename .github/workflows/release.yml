name: Release
on:
  pull_request_target:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v0.MINOR.PATCH tag to recover; never creates a new tag
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
jobs:
  admission:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      application: ${{ steps.paths.outputs.application }}
    steps:
      # The upstream API paginates but caps results at 3,000 files.
      - name: Require complete PR file observation
        if: github.event_name == 'pull_request_target' && !(github.event.pull_request.changed_files > 0 && github.event.pull_request.changed_files < 3000)
        run: |
          echo 'Missing or unsupported changed-file count; split PRs of 3,000 files or more.' >&2
          exit 1
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request_target'
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request_target'
        id: paths
        with:
          filters: .github/application-paths.yml
          predicate-quantifier: every
      - name: Validate application title
        if: steps.paths.outputs.application == 'true'
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          requireScope: true
          types: |
            feat
            fix
            perf
            refactor
            build
            ci
            chore
            test
            revert
  publish:
    needs: admission
    if: github.event_name == 'workflow_dispatch' || needs.admission.outputs.application == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      source_sha: ${{ github.event.pull_request.merge_commit_sha || '' }}
      recovery_tag: ${{ inputs.tag || '' }}
