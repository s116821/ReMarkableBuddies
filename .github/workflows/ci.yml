name: CI

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  policy:
    name: Release policy
    runs-on: ubuntu-latest
    outputs:
      application: ${{ steps.policy.outputs.application }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: policy
        run: python release/policy.py

  check:
    name: Check Build & Lint
    needs: policy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful policy check
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
        run: test "$POLICY_RESULT" = success
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request' && needs.policy.outputs.application == 'true'
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        if: github.event_name == 'pull_request' && needs.policy.outputs.application == 'true'
        with:
          components: rustfmt, clippy
          targets: armv7-unknown-linux-gnueabihf,aarch64-unknown-linux-gnu
      - name: Check formatting
        if: github.event_name == 'pull_request' && needs.policy.outputs.application == 'true'
        run: cargo fmt --all -- --check
      - name: Run clippy
        if: github.event_name == 'pull_request' && needs.policy.outputs.application == 'true'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Install cross
        if: github.event_name == 'pull_request' && needs.policy.outputs.application == 'true'
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 8c1a8aa4b661711f4b7b6ac07c2e8929ce2f7d27 --locked
      - name: Build for both tablets
        if: github.event_name == 'pull_request' && needs.policy.outputs.application == 'true'
        run: |
          cross build --locked --release --target armv7-unknown-linux-gnueabihf
          cross build --locked --release --target aarch64-unknown-linux-gnu

  test:
    name: Test
    needs: policy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful policy check
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
        run: test "$POLICY_RESULT" = success
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request' && needs.policy.outputs.application == 'true'
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        if: github.event_name == 'pull_request' && needs.policy.outputs.application == 'true'
      - uses: actions/setup-python@v5
        if: github.event_name == 'pull_request' && needs.policy.outputs.application == 'true'
        with:
          python-version: '3.12'
      - uses: ./.github/actions/release-tools
        if: github.event_name == 'pull_request' && needs.policy.outputs.application == 'true'
      - name: Release regression repositories
        if: github.event_name == 'pull_request' && needs.policy.outputs.application == 'true'
        run: |
          cargo fetch --locked
          python -m unittest discover -s release -v
      - name: Run tests
        if: github.event_name == 'pull_request' && needs.policy.outputs.application == 'true'
        run: cargo test --locked --all-features
