name: CI
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited
  push:
    branches:
      - main
permissions:
  contents: read
  pull-requests: read
jobs:
  title:
    name: PR Title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      application: ${{ steps.paths.outputs.application }}
      body_only: ${{ steps.metadata.outputs.body_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify only exact body edits as metadata
        id: metadata
        shell: bash
        run: |
          jq --version
          body_only="$(jq -r '
            if .action == "edited" and (.changes | type) == "object" then
              .changes | if keys == ["body"] and (.body | type) == "object" then
                .body | keys == ["from"] and (.from | type) == "string"
              else false end
            else false end
          ' "$GITHUB_EVENT_PATH")"
          printf 'body_only=%s\n' "$body_only" >> "$GITHUB_OUTPUT"
      - name: Refuse an incomplete PR file inventory
        if: github.event_name == 'pull_request' && (github.event.pull_request.changed_files <= 0 || github.event.pull_request.changed_files >= 3000)
        run: exit 1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: paths
        with:
          token: ${{ github.token }}
          filters: .github/application-paths.yml
          predicate-quantifier: every
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          ref: ${{ github.sha }}
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50
        if: github.event_name == 'pull_request' && steps.paths.outputs.application == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          requireScope: true
          types: |
            feat
            fix
            perf
            build
            ci
            chore
            refactor
            test
            revert
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          requireScope: true
        if: github.event_name == 'pull_request' && steps.paths.outputs.application != 'true'
  checks:
    name: ${{ needs.title.outputs.body_only == 'true' && 'PR metadata (no source checks)' || 'Checks' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Require unambiguous main push range
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          SOURCE_SHA: ${{ github.sha }}
        run: python cicd/release/admission.py range --before "$BEFORE" --sha "$SOURCE_SHA"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: paths
        with:
          token: ${{ github.token }}
          filters: .github/application-paths.yml
          predicate-quantifier: every
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          ref: ${{ github.sha }}
        if: github.event_name == 'push'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
        if: (needs.title.outputs.application == 'true' || steps.paths.outputs.application == 'true')
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          components: rustfmt, clippy
        if: (needs.title.outputs.application == 'true' || steps.paths.outputs.application == 'true')
      - uses: ./.github/actions/release-tools
        if: (needs.title.outputs.application == 'true' || steps.paths.outputs.application == 'true')
      - run: cargo fmt --all -- --check
        if: (needs.title.outputs.application == 'true' || steps.paths.outputs.application == 'true')
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
        if: (needs.title.outputs.application == 'true' || steps.paths.outputs.application == 'true')
      - name: Run host tests and retain normal-command compiler provenance
        run: |
          status=0
          cargo test --locked --all-features --message-format=json > "$RUNNER_TEMP/current-cargo-test.jsonl" || status=$?
          cat "$RUNNER_TEMP/current-cargo-test.jsonl"
          exit "$status"
        if: (needs.title.outputs.application == 'true' || steps.paths.outputs.application == 'true')
      - name: Exercise composed Reader using the retained normal binary
        timeout-minutes: 12
        env:
          CARGO_MESSAGES: ${{ runner.temp }}/current-cargo-test.jsonl
        run: |
          python -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tomllib
          sys.path.insert(0, 'scripts/predecessor')
          from capture_producer import select_command
          root = Path.cwd().resolve()
          messages = Path(os.environ['CARGO_MESSAGES']).read_text(encoding='utf-8')
          command = select_command(messages, root)
          normal = Path(command['executable'])
          declared = set(tomllib.loads((root / 'Cargo.toml').read_text())['features'])
          if not normal.is_absolute() or not normal.is_file() or not declared.issubset(command['features']):
              raise ValueError('complete normal-command artifact is required')
          libraries = {}
          finished = []
          for line in messages.splitlines():
              try:
                  value = json.loads(line)
              except ValueError:
                  continue
              if not isinstance(value, dict):
                  continue
              if value.get('reason') == 'build-finished':
                  finished.append(value.get('success'))
              target = value.get('target', {})
              if (value.get('reason') != 'compiler-artifact'
                      or value.get('package_id') != command['package_id']
                      or target.get('kind') != ['lib']
                      or value.get('profile', {}).get('test') is not True
                      or Path(target.get('src_path') or '').resolve() != root / 'src/lib.rs'
                      or set(value.get('features', [])) != set(command['features'])):
                  continue
              path = Path(value.get('executable') or '')
              if not path.is_absolute() or not path.is_file() or not path.resolve().is_relative_to(root / 'target'):
                  raise ValueError('invalid current library-test artifact')
              libraries[str(path.resolve())] = path.resolve()
          if finished != [True] or len(libraries) != 1:
              raise ValueError('one complete current library-test artifact is required')
          library = next(iter(libraries.values()))
          names = [
              'researched_pdf_opt_out_skips_transport',
              'researched_pdf_disabled_skips_transport',
              'researched_pdf_required_uses_guarded_search',
              'researched_pdf_selected_memory_stays_pinned',
              'researched_pdf_unclear_intent_stops_before_interpret',
              'researched_pdf_drift_refuses_handoff_and_generation',
              'researched_pdf_lost_ack_recovers_original_without_replay',
              'researched_pdf_currentness_loss_stops_later_work',
              'researched_pdf_withheld_search_expires_original_deadline',
              'researched_pdf_original_read_allowance_cannot_be_renewed',
          ]
          names = ['storage::sync::selected::tests::researched_reader::' + name for name in names]
          listing = subprocess.run([str(library), '--ignored', '--list', '--format', 'terse'],
                                   check=True, capture_output=True, text=True, timeout=30).stdout.splitlines()
          if any(listing.count(name + ': test') != 1 for name in names):
              raise ValueError('all named composed Reader cases must exist exactly once')
          env = os.environ.copy()
          env['BUDDY_RESEARCH_FIXTURE_COMMAND'] = str(normal)
          env['BUDDY_RESEARCH_FIXTURE_COMMAND_SHA256'] = hashlib.sha256(normal.read_bytes()).hexdigest()
          print('Retained normal command SHA256:', env['BUDDY_RESEARCH_FIXTURE_COMMAND_SHA256'], flush=True)
          for name in names:
              result = subprocess.run([str(library), '--ignored', '--exact', name, '--nocapture', '--test-threads=1'],
                                      env=env, capture_output=True, text=True, timeout=120)
              print(result.stdout, end='', flush=True)
              print(result.stderr, end='', file=sys.stderr, flush=True)
              result.check_returncode()
              summary = 'test result: ok. 1 passed; 0 failed; 0 ignored;'
              if sum(line.startswith(summary) for line in result.stdout.splitlines()) != 1:
                  raise ValueError('composed Reader case did not execute exactly once: ' + name)
          PY
        if: (needs.title.outputs.application == 'true' || steps.paths.outputs.application == 'true')
      - run: python -m unittest discover -s cicd/release -v
        if: (needs.title.outputs.application == 'true' || steps.paths.outputs.application == 'true')
      - name: Verify ordinary Git source admission in an isolated fixture
        timeout-minutes: 3
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 128 --memory 256m --cpus 2 \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 \
            --mount type=bind,source="$GITHUB_WORKSPACE/cicd/release",target=/tests,readonly \
            --workdir /tests \
            python:3.12-bookworm@sha256:034c3e9d991f148d14c32ff8350286b91420baca7757d37819c7a9cc771317a0 \
            python -B -m unittest discover -s integration -v
        if: (needs.title.outputs.application == 'true' || steps.paths.outputs.application == 'true')
      - run: python -m unittest discover -s scripts/systemd_fixture -p test_bootstrap_fixture.py -v
        if: (needs.title.outputs.application == 'true' || steps.paths.outputs.application == 'true')
      - run: npm ci --prefix cicd/release/fixtures --ignore-scripts --no-audit --no-fund
        if: (needs.title.outputs.application == 'true' || steps.paths.outputs.application == 'true')
      - run: npm audit --prefix cicd/release/fixtures
        if: (needs.title.outputs.application == 'true' || steps.paths.outputs.application == 'true')
      - name: Validate embedded configuration schema using the existing host command
        env:
          CARGO_MESSAGES: ${{ runner.temp }}/current-cargo-test.jsonl
        run: |
          binary="$(python - <<'PY'
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/predecessor')
          from capture_producer import select_command
          print(select_command(Path(os.environ['CARGO_MESSAGES']).read_text(encoding='utf-8'), Path.cwd())['executable'])
          PY
          )"
          node scripts/check_configuration_schema.mjs --validator "$GITHUB_WORKSPACE/cicd/release/fixtures/node_modules/ajv/dist/2020.js" --binary "$binary"
        if: (needs.title.outputs.application == 'true' || steps.paths.outputs.application == 'true')
      - name: Verify CI stage and artifact gates
        run: node --test cicd/release/fixtures/workflow.test.mjs
        if: (needs.title.outputs.application == 'true' || steps.paths.outputs.application == 'true')
      - name: Qualify predecessor library inside the existing Checks budget
        uses: ./.github/actions/predecessor-library
        if: (needs.title.outputs.application == 'true' || steps.paths.outputs.application == 'true')
        with:
          source_sha: ${{ github.sha }}
          source_head: ${{ github.event.pull_request.head.sha || github.sha }}
          cargo_messages: ${{ runner.temp }}/current-cargo-test.jsonl
    defaults:
      run:
        shell: bash
    outputs:
      application: ${{ github.event_name == 'pull_request' && needs.title.outputs.application || steps.paths.outputs.application }}
    needs: title
    if: "!cancelled() && (github.event_name == 'push' || needs.title.result == 'success') && needs.title.outputs.body_only != 'true'"
  application:
    name: ${{ needs.title.outputs.body_only == 'true' && 'PR metadata (no artifact jobs)' || 'application' }}
    needs: [title, checks]
    if: "!cancelled() && needs.checks.result == 'success' && needs.checks.outputs.application == 'true'"
    uses: ./.github/workflows/pipeline.yml
    permissions:
      contents: write
      pull-requests: read
    with:
      source_sha: ${{ github.sha }}
      release: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
