name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  policy:
    name: Changed paths and PR checks
    runs-on: ubuntu-latest
    outputs:
      application: ${{ steps.paths.outputs.application }}
    steps:
      # Read-only admission; application jobs never inherit write credentials.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refuse an incomplete PR file inventory
        if: github.event_name == 'pull_request' && (github.event.pull_request.changed_files <= 0 || github.event.pull_request.changed_files >= 3000)
        run: exit 1
      - name: Require unambiguous main push range
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          SOURCE_SHA: ${{ github.sha }}
        run: python release/admission.py range --before "$BEFORE" --sha "$SOURCE_SHA"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: paths
        with:
          token: ${{ github.token }}
          filters: .github/application-paths.yml
          predicate-quantifier: every
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          ref: ${{ github.sha }}
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        if: github.event_name == 'pull_request' && steps.paths.outputs.application == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          requireScope: true
          types: |
            feat
            fix
            perf
            build
            ci
            chore
            refactor
            test
            revert
  application:
    needs: policy
    if: needs.policy.outputs.application == 'true'
    uses: ./.github/workflows/pipeline.yml
    permissions:
      contents: write
      pull-requests: read
    with:
      source_sha: ${{ github.sha }}
      release: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
  result:
    name: CI result
    if: always()
    needs: [policy, application]
    runs-on: ubuntu-latest
    steps:
      - env:
          POLICY: ${{ needs.policy.result }}
          APPLICATION: ${{ needs.application.result }}
          DOCUMENTATION: ${{ needs.policy.outputs.application == 'false' }}
        run: |
          test "$POLICY" = success
          if test "$DOCUMENTATION" = true; then test "$APPLICATION" = skipped
          else test "$APPLICATION" = success; fi