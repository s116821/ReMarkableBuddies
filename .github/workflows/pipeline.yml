name: Ordered application pipeline
on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      release:
        type: boolean
        required: true
permissions:
  contents: read
concurrency:
  group: ${{ inputs.release && 'main-application-release' || format('pr-{0}', github.event.pull_request.number) }}
  queue: max
  cancel-in-progress: false
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.freeze.outputs.tag }}
      sha: ${{ steps.freeze.outputs.sha }}
      artifact_id: ${{ steps.artifacts.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-tools
        with:
          audit-dependencies: "false"
      - name: Read semantic candidate without creating any tag
        id: freeze
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          MAIN_RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          git checkout -B main "$SOURCE_SHA"
          tag=$(semantic-release -c cicd/release/python-semantic-release.toml version --print-tag)
          eligibility=()
          if test "$MAIN_RELEASE" = true; then eligibility+=(--require-semantic-source); fi
          python cicd/release/freeze.py candidate --tag "$tag" --sha "$SOURCE_SHA" "${eligibility[@]}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf,aarch64-unknown-linux-gnu
      - name: Install pinned cross
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 8c1a8aa4b661711f4b7b6ac07c2e8929ce2f7d27 --locked
      - run: python cicd/release/build.py build --tag "$TAG" --sha "$SHA" --output "$RUNNER_TEMP/packages"
        env:
          TAG: ${{ steps.freeze.outputs.tag }}
          SHA: ${{ steps.freeze.outputs.sha }}
      - name: Build bounded resident bootstrap diagnostics for qualification
        if: ${{ !inputs.release }}
        env:
          READER_BUDDY_CANDIDATE_TAG: ${{ steps.freeze.outputs.tag }}
          READER_BUDDY_CANDIDATE_SHA: ${{ steps.freeze.outputs.sha }}
          CROSS_CONFIG: cicd/release/Cross.release.toml
        run: |
          cross build --locked --release --target armv7-unknown-linux-gnueabihf --example resident_bootstrap_observer --features development-resident-bootstrap
          cross build --locked --release --target armv7-unknown-linux-gnueabihf --example resident_bootstrap_control --features development-resident-bootstrap
          mkdir "$RUNNER_TEMP/resident-observer"
          cp target/armv7-unknown-linux-gnueabihf/release/examples/resident_bootstrap_observer "$RUNNER_TEMP/resident-observer/"
          cp target/armv7-unknown-linux-gnueabihf/release/examples/resident_bootstrap_control "$RUNNER_TEMP/resident-observer/"
          cd "$RUNNER_TEMP/resident-observer"
          sha256sum resident_bootstrap_observer resident_bootstrap_control > artifact.sha256
          printf '%s\n' "$READER_BUDDY_CANDIDATE_SHA" > source.sha
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !inputs.release }}
        with:
          name: resident-observer-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/resident-observer/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: artifacts
        with:
          name: candidate-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/packages/*
          if-no-files-found: error
          retention-days: 14
    defaults:
      run:
        shell: bash
  integration:
    name: Integration
    needs: build
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.build.outputs.tag }}
      SHA: ${{ needs.build.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/packages
          merge-multiple: true
      - run: python cicd/release/build.py integrate --tag "$TAG" --sha "$SHA" --output "$RUNNER_TEMP/packages"
    defaults:
      run:
        shell: bash
  release:
    name: Release
    timeout-minutes: 20
    needs:
      - build
      - integration
    if: inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      TAG: ${{ needs.build.outputs.tag }}
      SHA: ${{ needs.build.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - uses: ./.github/actions/release-tools
        with:
          audit-dependencies: "false"
      - uses: octokit/graphql-action@ddde8ebb2493e79f390e6449c725c21663a67505
        id: merged
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          query: |
            query($owner: String!, $repo: String!, $sha: String!) {
              repository(owner: $owner, name: $repo) {
                object(expression: $sha) { ... on Commit {
                  oid associatedPullRequests(first: 10) { nodes {
                    merged baseRefName mergeCommit { oid }
                  } }
                } }
              }
            }
          variables: |
            owner: ${{ github.repository_owner }}
            repo: ${{ github.event.repository.name }}
            sha: ${{ needs.build.outputs.sha }}
      - name: Require exact merged-main admission
        env:
          RELEASE_OBSERVATION: ${{ steps.merged.outputs.data }}
        run: python cicd/release/admission.py merge --sha "$SHA"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/packages
          merge-multiple: true
      - name: Verify the exact integration-tested upload inventory
        run: python cicd/release/build.py verify --tag "$TAG" --sha "$SHA" --output "$RUNNER_TEMP/packages"
      - name: Official tag only after every preceding job passed
        run: |
          set -euo pipefail
          git checkout -B main "$SHA"
          python cicd/release/freeze.py candidate --require-semantic-source --tag "$TAG" --sha "$SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main:refs/remotes/origin/main --tags
          git merge-base --is-ancestor "$SHA" refs/remotes/origin/main
          test "$(semantic-release -c cicd/release/python-semantic-release.toml version --print-tag)" = "$TAG"
          semantic-release -c cicd/release/python-semantic-release.toml version --no-commit --no-changelog --skip-build --push --no-vcs-release
          python cicd/release/freeze.py remote --tag "$TAG" --sha "$SHA"
      - uses: octokit/graphql-action@ddde8ebb2493e79f390e6449c725c21663a67505
        id: lookup
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          query: |
            query($owner: String!, $repo: String!, $tag: String!) {
              repository(owner: $owner, name: $repo) {
                release(tagName: $tag) {
                  databaseId tagName isDraft description
                  releaseAssets(first: 1) { totalCount }
                }
              }
            }
          variables: |
            owner: ${{ github.repository_owner }}
            repo: ${{ github.event.repository.name }}
            tag: ${{ needs.build.outputs.tag }}
      - name: Validate exact release observation
        id: lookup_proof
        env:
          RELEASE_OBSERVATION: ${{ steps.lookup.outputs.data }}
        run: python cicd/release/verify_release.py lookup --tag "$TAG" --sha "$SHA"
      - uses: octokit/request-action@b91aabaa861c777dcdb14e2387e30eddf04619ae
        id: create
        if: steps.lookup_proof.outputs.absent == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          route: POST /repos/{repo}/releases
          repo: ${{ github.repository }}
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ needs.build.outputs.sha }}
          draft: true
          name: ${{ needs.build.outputs.tag }}
      - uses: octokit/request-action@b91aabaa861c777dcdb14e2387e30eddf04619ae
        id: before_upload
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          route: GET /repos/{repo}/releases/{release_id}
          repo: ${{ github.repository }}
          release_id: ${{ steps.create.outputs.data && fromJSON(steps.create.outputs.data).id || steps.lookup_proof.outputs.release_id }}
      - name: Verify retained bytes and select only missing names
        id: retained
        env:
          RELEASE_OBSERVATION: ${{ steps.before_upload.outputs.data }}
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_ID: ${{ steps.create.outputs.data && fromJSON(steps.create.outputs.data).id || steps.lookup_proof.outputs.release_id }}
        run: python cicd/release/verify_release.py retained --tag "$TAG" --sha "$SHA" --release-id "$EXPECTED_ID" --packages "$RUNNER_TEMP/packages" --missing "$RUNNER_TEMP/missing-packages"
      - uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de
        if: steps.retained.outputs.draft == 'true' && steps.retained.outputs.files != ''
        with:
          release_id: ${{ steps.retained.outputs.release_id }}
          repo_token: ${{ github.token }}
          tag: ${{ needs.build.outputs.tag }}
          target_commit: ${{ needs.build.outputs.sha }}
          file: ${{ runner.temp }}/missing-packages/*
          file_glob: true
          overwrite: false
          check_duplicates: true
          draft: true
          promote: false
          prerelease: false
          make_latest: false
      - uses: octokit/request-action@b91aabaa861c777dcdb14e2387e30eddf04619ae
        id: after_upload
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          route: GET /repos/{repo}/releases/{release_id}
          repo: ${{ github.repository }}
          release_id: ${{ steps.retained.outputs.release_id }}
      - name: Verify same ID and all remote bytes before publication
        id: complete
        env:
          RELEASE_OBSERVATION: ${{ steps.after_upload.outputs.data }}
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_ID: ${{ steps.retained.outputs.release_id }}
        run: |
          python cicd/release/verify_release.py retained --complete --tag "$TAG" --sha "$SHA" --release-id "$EXPECTED_ID" --packages "$RUNNER_TEMP/packages" --missing "$RUNNER_TEMP/missing-packages"
          python cicd/release/freeze.py remote --tag "$TAG" --sha "$SHA"
      - uses: octokit/request-action@b91aabaa861c777dcdb14e2387e30eddf04619ae
        if: steps.complete.outputs.draft == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          route: PATCH /repos/{repo}/releases/{release_id}
          repo: ${{ github.repository }}
          release_id: ${{ steps.complete.outputs.release_id }}
          draft: false
          make_latest: legacy
          body: ${{ toJSON(steps.complete.outputs.notes) }}
