name: Observe hosted Git ownership configuration
on:
  workflow_dispatch:
    inputs:
      observe_git:
        description: Run the separately reviewed key-only configuration observation
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  observation:
    if: ${{ inputs.observe_git == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare key-only observer and inspect initial configuration
        run: |
          cat > "$RUNNER_TEMP/observe-safe-directory.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          printf 'Observation phase: %s\n' "$1"
          query() {
            local label="$1"
            shift
            local result
            printf 'Context: %s\n' "$label"
            if timeout 10s git "$@" config --show-origin --show-scope --get-all safe.directory; then
              result=0
            else
              result=$?
            fi
            case "$result" in
              0) printf 'Query result: entries present\n' ;;
              1) printf 'Query result: no entries\n' ;;
              *) printf 'Query failed: exit %s\n' "$result" >&2; return "$result" ;;
            esac
          }
          query outside-checkouts -C "$RUNNER_TEMP"
          for context in producer release-source sdk-source; do
            if test -d "$GITHUB_WORKSPACE/$context/.git"; then
              query "$context" -C "$GITHUB_WORKSPACE/$context"
            fi
          done
          SCRIPT
          bash "$RUNNER_TEMP/observe-safe-directory.sh" initial
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: producer
          fetch-depth: 0
          persist-credentials: false
          set-safe-directory: false
      - name: Observe after producer checkout
        run: bash "$RUNNER_TEMP/observe-safe-directory.sh" producer-checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v0.65.0
          path: release-source
          fetch-depth: 0
          persist-credentials: false
          set-safe-directory: false
      - name: Observe after release checkout
        run: |
          test "$(git -C "$GITHUB_WORKSPACE/release-source" rev-parse HEAD)" = 4a75316e358a471a08ba28c0c9408d1c6eacff3f
          bash "$RUNNER_TEMP/observe-safe-directory.sh" release-checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: s116821/ReMarkableOpenSDK
          ref: v0.2.0
          path: sdk-source
          fetch-depth: 0
          persist-credentials: false
          set-safe-directory: false
      - name: Observe after SDK checkout
        run: |
          test "$(git -C "$GITHUB_WORKSPACE/sdk-source" rev-parse HEAD)" = a0c6480be6785480c2e0da76a3c06697a18efae4
          bash "$RUNNER_TEMP/observe-safe-directory.sh" sdk-checkout
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          targets: armv7-unknown-linux-gnueabihf,aarch64-unknown-linux-gnu
      - name: Observe after Rust setup and before Cross installation
        run: bash "$RUNNER_TEMP/observe-safe-directory.sh" before-cross
      - name: Install the same maintained pinned Cross tool
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 8c1a8aa4b661711f4b7b6ac07c2e8929ce2f7d27 --locked
      - name: Observe after Cross installation
        run: bash "$RUNNER_TEMP/observe-safe-directory.sh" after-cross
    defaults:
      run:
        shell: bash
