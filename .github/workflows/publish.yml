name: Publish exact tag
on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        default: ''
      recovery_tag:
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: rust-release
  queue: max
  cancel-in-progress: false
jobs:
  tag:
    name: Immutable tag and recoverable draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      sha: ${{ steps.identity.outputs.sha }}
      unfinished: ${{ fromJSON(steps.lookup.outputs.data).repository.release.isDraft || steps.create.outputs.data != '' }}
      release_id: ${{ steps.create.outputs.data && fromJSON(steps.create.outputs.data).id || fromJSON(steps.lookup.outputs.data).repository.release.databaseId }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || format('refs/tags/{0}', inputs.recovery_tag) }}
          fetch-depth: 0
      - name: Require exact source from main
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RECOVERY_TAG: ${{ inputs.recovery_tag }}
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main --tags
          test "$(git rev-parse --is-shallow-repository)" = false
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          if test -n "$SOURCE_SHA"; then
            test -z "$RECOVERY_TAG"
            test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
            test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 2
          else
            [[ "$RECOVERY_TAG" =~ ^v0\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            test "$(git rev-parse "refs/tags/$RECOVERY_TAG^{commit}")" = "$(git rev-parse HEAD)"
          fi
      - uses: GitTools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        if: inputs.recovery_tag == ''
        with:
          versionSpec: 6.8.2
      - uses: GitTools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        if: inputs.recovery_tag == ''
        id: version
        with:
          useConfigFile: true
          configFilePath: GitVersion.yml
          disableNormalization: true
          disableCache: true
      - name: Verify calculated identity and pre-1.0 gate
        id: identity
        env:
          TAG: ${{ inputs.recovery_tag || format('v{0}', steps.version.outputs.majorMinorPatch) }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CALCULATED_SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          # REM-35 alone removes the major-release hold; no version override.
          [[ "$TAG" =~ ^v0\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          sha=$(git rev-parse HEAD)
          if test -n "$SOURCE_SHA"; then test "$CALCULATED_SHA" = "$SOURCE_SHA"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: rickstaa/action-create-tag@a1c7777fcb2fee4f19b0f283ba888afa11678b72 # v1.7.2
        if: inputs.recovery_tag == ''
        with:
          tag: ${{ steps.identity.outputs.tag }}
          commit_sha: ${{ steps.identity.outputs.sha }}
          force_push_tag: false
          tag_exists_error: false
      - name: Verify remote tag before any app build
        env:
          TAG: ${{ steps.identity.outputs.tag }}
          SHA: ${{ steps.identity.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/$TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$SHA"
      - uses: octokit/graphql-action@ddde8ebb2493e79f390e6449c725c21663a67505 # v3.0.2
        id: lookup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          query: |
            query($owner: String!, $repo: String!, $tag: String!) {
              repository(owner: $owner, name: $repo) {
                release(tagName: $tag) { databaseId tagName isDraft releaseAssets(first: 1) { totalCount } }
              }
            }
          variables: |
            owner: ${{ github.repository_owner }}
            repo: ${{ github.event.repository.name }}
            tag: ${{ steps.identity.outputs.tag }}
      - name: Require complete release observation before build
        if: >-
          ${{ !fromJSON(steps.lookup.outputs.data).repository || !contains(toJSON(fromJSON(steps.lookup.outputs.data).repository), '"release":') || (toJSON(fromJSON(steps.lookup.outputs.data).repository.release) != 'null' && ((fromJSON(steps.lookup.outputs.data).repository.release.tagName != steps.identity.outputs.tag || !(fromJSON(steps.lookup.outputs.data).repository.release.databaseId > 0) || (toJSON(fromJSON(steps.lookup.outputs.data).repository.release.databaseId) == 'null' || !(fromJSON(steps.lookup.outputs.data).repository.release.databaseId >= 0 && fromJSON(steps.lookup.outputs.data).repository.release.databaseId <= 2147483647) || startsWith(toJSON(fromJSON(steps.lookup.outputs.data).repository.release.databaseId), '"') || contains(toJSON(fromJSON(steps.lookup.outputs.data).repository.release.databaseId), '.') || toJSON(fromJSON(steps.lookup.outputs.data).repository.release.databaseId) == 'true' || toJSON(fromJSON(steps.lookup.outputs.data).repository.release.databaseId) == 'false') || !(toJSON(fromJSON(steps.lookup.outputs.data).repository.release.isDraft) == 'true' || toJSON(fromJSON(steps.lookup.outputs.data).repository.release.isDraft) == 'false')) || (fromJSON(steps.lookup.outputs.data).repository.release.isDraft && (toJSON(fromJSON(steps.lookup.outputs.data).repository.release.releaseAssets.totalCount) == 'null' || !(fromJSON(steps.lookup.outputs.data).repository.release.releaseAssets.totalCount >= 0 && fromJSON(steps.lookup.outputs.data).repository.release.releaseAssets.totalCount <= 26) || startsWith(toJSON(fromJSON(steps.lookup.outputs.data).repository.release.releaseAssets.totalCount), '"') || contains(toJSON(fromJSON(steps.lookup.outputs.data).repository.release.releaseAssets.totalCount), '.') || toJSON(fromJSON(steps.lookup.outputs.data).repository.release.releaseAssets.totalCount) == 'true' || toJSON(fromJSON(steps.lookup.outputs.data).repository.release.releaseAssets.totalCount) == 'false')))) }}
        run: exit 1
      - uses: octokit/request-action@b91aabaa861c777dcdb14e2387e30eddf04619ae # v3.0.0
        id: create
        if: ${{ toJSON(fromJSON(steps.lookup.outputs.data).repository.release) == 'null' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          route: POST /repos/{repo}/releases
          repo: ${{ github.repository }}
          tag_name: ${{ steps.identity.outputs.tag }}
          target_commitish: ${{ steps.identity.outputs.sha }}
          draft: true
          generate_release_notes: true
      - name: Require exact newly created draft identity
        if: >-
          ${{ toJSON(fromJSON(steps.lookup.outputs.data).repository.release) == 'null' && (steps.create.outputs.status != '201' || steps.create.outputs.data == '' || (fromJSON(steps.create.outputs.data).tag_name != steps.identity.outputs.tag || !(fromJSON(steps.create.outputs.data).id > 0) || (toJSON(fromJSON(steps.create.outputs.data).id) == 'null' || !(fromJSON(steps.create.outputs.data).id >= 0 && fromJSON(steps.create.outputs.data).id <= 2147483647) || startsWith(toJSON(fromJSON(steps.create.outputs.data).id), '"') || contains(toJSON(fromJSON(steps.create.outputs.data).id), '.') || toJSON(fromJSON(steps.create.outputs.data).id) == 'true' || toJSON(fromJSON(steps.create.outputs.data).id) == 'false') || !(toJSON(fromJSON(steps.create.outputs.data).draft) == 'true' || toJSON(fromJSON(steps.create.outputs.data).draft) == 'false')) || toJSON(fromJSON(steps.create.outputs.data).draft) != 'true') }}
        run: exit 1
  build:
    name: Build packages from verified tag
    needs: tag
    if: needs.tag.outputs.unfinished == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Tooling follows this workflow; source follows the immutable release tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf,aarch64-unknown-linux-gnu
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 8c1a8aa4b661711f4b7b6ac07c2e8929ce2f7d27 --locked
      - name: Install ELF inspection tool
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends binutils
      - name: Compile and verify both tablet packages
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          SHA: ${{ needs.tag.outputs.sha }}
        run: python tooling/release/build.py --source source --tag "$TAG" --sha "$SHA" --output "$RUNNER_TEMP/packages"
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ needs.tag.outputs.tag }}
          path: ${{ runner.temp }}/packages/*
          if-no-files-found: error
          retention-days: 7
  publish:
    name: Upload draft assets then publish
    needs: [tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages-${{ needs.tag.outputs.tag }}
          path: packages
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify downloaded fixed package inventory
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          SHA: ${{ needs.tag.outputs.sha }}
        run: python tooling/release/build.py --verify-only --tag "$TAG" --sha "$SHA" --output packages
      - uses: octokit/graphql-action@ddde8ebb2493e79f390e6449c725c21663a67505 # v3.0.2
        id: before_upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          query: |
            query($owner: String!, $repo: String!, $tag: String!) {
              repository(owner: $owner, name: $repo) {
                release(tagName: $tag) { databaseId tagName isDraft releaseAssets(first: 1) { totalCount } }
              }
            }
          variables: |
            owner: ${{ github.repository_owner }}
            repo: ${{ github.event.repository.name }}
            tag: ${{ needs.tag.outputs.tag }}
      - name: Require same draft and bounded upload inventory
        if: >-
          ${{ (fromJSON(steps.before_upload.outputs.data).repository.release.tagName != needs.tag.outputs.tag || !(fromJSON(steps.before_upload.outputs.data).repository.release.databaseId > 0) || (toJSON(fromJSON(steps.before_upload.outputs.data).repository.release.databaseId) == 'null' || !(fromJSON(steps.before_upload.outputs.data).repository.release.databaseId >= 0 && fromJSON(steps.before_upload.outputs.data).repository.release.databaseId <= 2147483647) || startsWith(toJSON(fromJSON(steps.before_upload.outputs.data).repository.release.databaseId), '"') || contains(toJSON(fromJSON(steps.before_upload.outputs.data).repository.release.databaseId), '.') || toJSON(fromJSON(steps.before_upload.outputs.data).repository.release.databaseId) == 'true' || toJSON(fromJSON(steps.before_upload.outputs.data).repository.release.databaseId) == 'false') || !(toJSON(fromJSON(steps.before_upload.outputs.data).repository.release.isDraft) == 'true' || toJSON(fromJSON(steps.before_upload.outputs.data).repository.release.isDraft) == 'false')) || fromJSON(steps.before_upload.outputs.data).repository.release.databaseId != needs.tag.outputs.release_id || toJSON(fromJSON(steps.before_upload.outputs.data).repository.release.isDraft) != 'true' || (toJSON(fromJSON(steps.before_upload.outputs.data).repository.release.releaseAssets.totalCount) == 'null' || !(fromJSON(steps.before_upload.outputs.data).repository.release.releaseAssets.totalCount >= 0 && fromJSON(steps.before_upload.outputs.data).repository.release.releaseAssets.totalCount <= 26) || startsWith(toJSON(fromJSON(steps.before_upload.outputs.data).repository.release.releaseAssets.totalCount), '"') || contains(toJSON(fromJSON(steps.before_upload.outputs.data).repository.release.releaseAssets.totalCount), '.') || toJSON(fromJSON(steps.before_upload.outputs.data).repository.release.releaseAssets.totalCount) == 'true' || toJSON(fromJSON(steps.before_upload.outputs.data).repository.release.releaseAssets.totalCount) == 'false') }}
        run: exit 1
      - uses: AButler/upload-release-assets@34491005a5d7ec239a784e460807ce844fde7962 # v4.0.0
        with:
          release-id: ${{ needs.tag.outputs.release_id }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          files: 'packages/reader-buddy-armv7-unknown-linux-gnueabihf.tar.gz;packages/reader-buddy-aarch64-unknown-linux-gnu.tar.gz;packages/provenance.json'
      - uses: octokit/graphql-action@ddde8ebb2493e79f390e6449c725c21663a67505 # v3.0.2
        id: before_publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          query: |
            query($owner: String!, $repo: String!, $tag: String!) {
              repository(owner: $owner, name: $repo) {
                release(tagName: $tag) { databaseId tagName isDraft releaseAssets(first: 1) { totalCount } }
              }
            }
          variables: |
            owner: ${{ github.repository_owner }}
            repo: ${{ github.event.repository.name }}
            tag: ${{ needs.tag.outputs.tag }}
      - name: Require same draft before publication
        if: >-
          ${{ (fromJSON(steps.before_publish.outputs.data).repository.release.tagName != needs.tag.outputs.tag || !(fromJSON(steps.before_publish.outputs.data).repository.release.databaseId > 0) || (toJSON(fromJSON(steps.before_publish.outputs.data).repository.release.databaseId) == 'null' || !(fromJSON(steps.before_publish.outputs.data).repository.release.databaseId >= 0 && fromJSON(steps.before_publish.outputs.data).repository.release.databaseId <= 2147483647) || startsWith(toJSON(fromJSON(steps.before_publish.outputs.data).repository.release.databaseId), '"') || contains(toJSON(fromJSON(steps.before_publish.outputs.data).repository.release.databaseId), '.') || toJSON(fromJSON(steps.before_publish.outputs.data).repository.release.databaseId) == 'true' || toJSON(fromJSON(steps.before_publish.outputs.data).repository.release.databaseId) == 'false') || !(toJSON(fromJSON(steps.before_publish.outputs.data).repository.release.isDraft) == 'true' || toJSON(fromJSON(steps.before_publish.outputs.data).repository.release.isDraft) == 'false')) || fromJSON(steps.before_publish.outputs.data).repository.release.databaseId != needs.tag.outputs.release_id || toJSON(fromJSON(steps.before_publish.outputs.data).repository.release.isDraft) != 'true' || (toJSON(fromJSON(steps.before_publish.outputs.data).repository.release.releaseAssets.totalCount) == 'null' || !(fromJSON(steps.before_publish.outputs.data).repository.release.releaseAssets.totalCount >= 0 && fromJSON(steps.before_publish.outputs.data).repository.release.releaseAssets.totalCount <= 30) || startsWith(toJSON(fromJSON(steps.before_publish.outputs.data).repository.release.releaseAssets.totalCount), '"') || contains(toJSON(fromJSON(steps.before_publish.outputs.data).repository.release.releaseAssets.totalCount), '.') || toJSON(fromJSON(steps.before_publish.outputs.data).repository.release.releaseAssets.totalCount) == 'true' || toJSON(fromJSON(steps.before_publish.outputs.data).repository.release.releaseAssets.totalCount) == 'false') }}
        run: exit 1
      - uses: octokit/request-action@b91aabaa861c777dcdb14e2387e30eddf04619ae # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          route: PATCH /repos/{repo}/releases/{release_id}
          repo: ${{ github.repository }}
          release_id: ${{ needs.tag.outputs.release_id }}
          draft: false
          make_latest: legacy
