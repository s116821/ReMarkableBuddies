# Review candidate only. Not installed/dispatched; tool files must join the same PR.
name: Offline predecessor library qualification
on:
  pull_request:
    paths:
      - tools/predecessor/**
      - .github/workflows/predecessor-library-qualification.yml
  workflow_dispatch:
    inputs:
      current_ref:
        description: Independently reviewed full current source commit
        required: true
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.current_ref }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 68e42968b4c58b6f8ed1102078d78b40fad33ffc
          path: predecessor
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - name: Verify exact sources and qualification inputs
        env:
          EXPECTED_CURRENT: ${{ github.event.pull_request.head.sha || inputs.current_ref }}
        shell: bash
        run: |
          set -eu
          mkdir -p qualification-evidence
          git -C predecessor rev-parse HEAD > qualification-evidence/old-source.txt
          git -C candidate rev-parse HEAD > qualification-evidence/current-source.txt
          rustc --version --verbose > qualification-evidence/rustc.txt
          cargo --version > qualification-evidence/cargo.txt
          sha256sum predecessor/Cargo.lock candidate/Cargo.lock candidate/tools/predecessor/* > qualification-evidence/source-input-hashes.txt
          test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_CURRENT"
          test "$(git -C predecessor rev-parse HEAD)" = 68e42968b4c58b6f8ed1102078d78b40fad33ffc
          echo 'ec3ed0f9c9dbe6f4f9aec911edfeb738c69f4a828fd0a3c88a692b39aa1c1cee  candidate/tools/predecessor/old_storage_lease_driver.rs' | sha256sum --check
          echo '1912dafddb0e7c20bfba193c1d75e45a4ccb355601d6dc4f7fe68e5825130073  candidate/tools/predecessor/old_library_outer.py' | sha256sum --check
          test ! -e predecessor/examples/rem23_old_storage_lease.rs
          mkdir -p predecessor/examples
          cp candidate/tools/predecessor/old_storage_lease_driver.rs predecessor/examples/rem23_old_storage_lease.rs
          git -C predecessor diff --exit-code HEAD
          test "$(git -C predecessor ls-files --others --exclude-standard)" = examples/rem23_old_storage_lease.rs
      - name: Compile unchanged published library and current command
        shell: bash
        run: |
          set -eu
          cargo build --locked --all-features --manifest-path predecessor/Cargo.toml --example rem23_old_storage_lease --target-dir predecessor-target
          cargo build --locked --all-features --manifest-path candidate/Cargo.toml --bin reader-buddy --target-dir candidate-target
          sha256sum predecessor/Cargo.lock candidate/Cargo.lock predecessor-target/debug/examples/rem23_old_storage_lease candidate-target/debug/reader-buddy candidate/tools/predecessor/* > qualification-evidence/input-binary-hashes.txt
          git -C predecessor diff --exit-code HEAD
          test "$(git -C predecessor ls-files --others --exclude-standard)" = examples/rem23_old_storage_lease.rs
          python -c 'import json,hashlib,subprocess;from pathlib import Path;h=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest();r={"old_source":subprocess.check_output(["git","-C","predecessor","rev-parse","HEAD"],text=True).strip(),"current_source":subprocess.check_output(["git","-C","candidate","rev-parse","HEAD"],text=True).strip(),"old_driver_source_sha256":h("candidate/tools/predecessor/old_storage_lease_driver.rs"),"old_driver_sha256":h("predecessor-target/debug/examples/rem23_old_storage_lease"),"current_binary_sha256":h("candidate-target/debug/reader-buddy")};Path("qualification-evidence/build-receipt.json").write_text(json.dumps(r,indent=2))'
      - name: Run bounded synthetic lease and admission checks
        shell: bash
        run: |
          set -eu
          OLD_SHA="$(python -c 'import json;print(json.load(open("qualification-evidence/build-receipt.json"))["old_driver_sha256"])')"
          CURRENT_SHA="$(python -c 'import json;print(json.load(open("qualification-evidence/build-receipt.json"))["current_binary_sha256"])')"
          python -B candidate/tools/predecessor/old_library_outer.py --old-driver "$GITHUB_WORKSPACE/predecessor-target/debug/examples/rem23_old_storage_lease" --old-driver-sha256 "$OLD_SHA" --current-binary "$GITHUB_WORKSPACE/candidate-target/debug/reader-buddy" --current-binary-sha256 "$CURRENT_SHA" --build-receipt "$GITHUB_WORKSPACE/qualification-evidence/build-receipt.json" --output "$GITHUB_WORKSPACE/qualification-evidence/runtime"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: predecessor-library-qualification-${{ github.run_id }}
          path: qualification-evidence
          retention-days: 7
