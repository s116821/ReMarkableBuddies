name: Offline predecessor library qualification
description: Bounded unchanged-source library checks inside the existing Checks stage
inputs:
  source_sha:
    required: true
    description: Actual checked-out and compiled CI commit
  source_head:
    required: true
    description: Declared source head, separately checked for tree equivalence
  cargo_messages:
    required: true
    description: Existing cargo test compiler artifact stream
runs:
  using: composite
  steps:
    - name: Freeze existing normal command and source provenance
      shell: bash
      env:
        SOURCE_SHA: ${{ inputs.source_sha }}
        SOURCE_HEAD: ${{ inputs.source_head }}
        CARGO_MESSAGES: ${{ inputs.cargo_messages }}
      run: |
        set -eu
        python -B -m unittest discover -s scripts/predecessor -p test_capture_producer.py -v
        mkdir -p qualification-evidence
        rustc --version --verbose > qualification-evidence/current-rustc.txt
        cargo --version > qualification-evidence/current-cargo.txt
        git rev-parse HEAD > qualification-evidence/current-source.txt
        git rev-parse 'HEAD^{tree}' > qualification-evidence/current-tree.txt
        python -B scripts/predecessor/capture_producer.py --workspace "$GITHUB_WORKSPACE" --cargo-messages "$CARGO_MESSAGES" --source-sha "$SOURCE_SHA" --source-head "$SOURCE_HEAD" --output qualification-evidence/current-producer.json
    - uses: actions/checkout@v4
      with:
        ref: 68e42968b4c58b6f8ed1102078d78b40fad33ffc
        path: .predecessor-qualification-source
        fetch-depth: 0
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.99.1
    - name: Verify exact old source and inject the sole reviewed example
      shell: bash
      run: |
        set -eu
        git -C .predecessor-qualification-source rev-parse HEAD > qualification-evidence/old-source.txt
        rustc --version --verbose > qualification-evidence/old-rustc.txt
        cargo --version > qualification-evidence/old-cargo.txt
        sha256sum .predecessor-qualification-source/Cargo.lock Cargo.lock scripts/predecessor/capture_producer.py scripts/predecessor/test_capture_producer.py scripts/predecessor/old_library_outer.py scripts/predecessor/old_storage_lease_driver.rs > qualification-evidence/source-input-hashes.txt
        test "$(git -C .predecessor-qualification-source rev-parse HEAD)" = 68e42968b4c58b6f8ed1102078d78b40fad33ffc
        echo 'e0e1e547740f45cd2cebadbd6d1bcba98426d43633f00212961f7d8e56fb5297  scripts/predecessor/old_storage_lease_driver.rs' | sha256sum --check
        echo 'd8a357ceaf16283c621e792a577fcff946e6e7ac306d735a41708c81c58b8cb2  scripts/predecessor/old_library_outer.py' | sha256sum --check
        test ! -e .predecessor-qualification-source/examples/rem23_old_storage_lease.rs
        mkdir -p .predecessor-qualification-source/examples
        cp scripts/predecessor/old_storage_lease_driver.rs .predecessor-qualification-source/examples/rem23_old_storage_lease.rs
        git -C .predecessor-qualification-source diff --exit-code HEAD
        test "$(git -C .predecessor-qualification-source ls-files --others --exclude-standard)" = examples/rem23_old_storage_lease.rs
    - name: Build only the old example, reusing existing host dependencies
      shell: bash
      run: |
        set -eu
        cargo build --locked --all-features --manifest-path .predecessor-qualification-source/Cargo.toml --example rem23_old_storage_lease --target-dir "$GITHUB_WORKSPACE/target"
        git -C .predecessor-qualification-source diff --exit-code HEAD
        test "$(git -C .predecessor-qualification-source ls-files --others --exclude-standard)" = examples/rem23_old_storage_lease.rs
        sha256sum .predecessor-qualification-source/Cargo.lock Cargo.lock target/debug/examples/rem23_old_storage_lease target/debug/reader-buddy scripts/predecessor/capture_producer.py scripts/predecessor/test_capture_producer.py scripts/predecessor/old_library_outer.py scripts/predecessor/old_storage_lease_driver.rs > qualification-evidence/input-binary-hashes.txt
        python -c 'import json,hashlib,subprocess;from pathlib import Path;h=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest();r=json.loads(Path("qualification-evidence/current-producer.json").read_bytes());assert h("target/debug/reader-buddy")==r["current_binary_sha256"],"old build changed the frozen current command";r.update(old_source=subprocess.check_output(["git","-C",".predecessor-qualification-source","rev-parse","HEAD"],text=True).strip(),old_driver_source_sha256=h("scripts/predecessor/old_storage_lease_driver.rs"),old_driver_sha256=h("target/debug/examples/rem23_old_storage_lease"));Path("qualification-evidence/build-receipt.json").write_text(json.dumps(r,indent=2))'
    - name: Run bounded synthetic sync, lease and admission checks
      shell: bash
      run: |
        set -eu
        OLD_SHA="$(python -c 'import json;print(json.load(open("qualification-evidence/build-receipt.json"))["old_driver_sha256"])')"
        CURRENT_SHA="$(python -c 'import json;print(json.load(open("qualification-evidence/build-receipt.json"))["current_binary_sha256"])')"
        python -B scripts/predecessor/old_library_outer.py --old-driver "$GITHUB_WORKSPACE/target/debug/examples/rem23_old_storage_lease" --old-driver-sha256 "$OLD_SHA" --current-binary "$GITHUB_WORKSPACE/target/debug/reader-buddy" --current-binary-sha256 "$CURRENT_SHA" --build-receipt "$GITHUB_WORKSPACE/qualification-evidence/build-receipt.json" --output "$GITHUB_WORKSPACE/qualification-evidence/runtime"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: predecessor-library-qualification-${{ github.run_id }}
        path: qualification-evidence
        retention-days: 7
