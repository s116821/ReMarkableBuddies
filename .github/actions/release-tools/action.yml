name: Pinned maintained release tools
description: Install hash-locked Python Semantic Release; no application build or write credentials
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - shell: bash
      run: python -m pip install --require-hashes -r release/python-tools.lock
    - shell: bash
      run: python -m pip_audit --require-hashes -r release/python-tools.lock