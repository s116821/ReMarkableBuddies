name: Pinned maintained release tools
description: Install hash-locked Python Semantic Release; no application build or write credentials
inputs:
  audit-dependencies:
    description: Audit the locked release dependencies; downstream CI jobs depend on Checks
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'
    - shell: bash
      run: python -m pip install --require-hashes -r cicd/release/python-tools.lock
    - shell: bash
      if: inputs.audit-dependencies == 'true'
      run: python -m pip_audit --require-hashes -r cicd/release/python-tools.lock
